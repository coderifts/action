name: test
on:
  push:
  pull_request:
jobs:
  action-against-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # dist/ must be what src/ builds to, and the built action runs against the published CLI tarball.
      - run: npm run build && git diff --exit-code dist/
      - run: npm test
