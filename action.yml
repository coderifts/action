name: 'CodeRifts API Governance'
description: 'Detect breaking changes in OpenAPI schemas on every pull request'
author: 'CodeRifts'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api-key:
    description: 'CodeRifts API key'
    required: true
  base-branch:
    description: 'Base branch to compare against'
    required: false
    default: 'main'
  fail-on-breaking:
    description: 'Fail the workflow on breaking changes'
    required: false
    default: 'true'
  spec-path:
    description: 'Contract file to compare, relative to the repository root; its version on origin/<base-branch> is the base'
    required: false
    default: 'api/openapi.yaml'

runs:
  using: 'node20'
  main: 'dist/index.js'
